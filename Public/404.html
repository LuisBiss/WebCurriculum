<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — Luis Francisco Bissoli do Amparo</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f1c24">
    <link rel="icon" href="Assets/img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="Assets/style.css">
    <style>
        /* A folha principal pressupõe o layout do currículo; aqui basta
           centrar um bloco curto reusando os mesmos tokens. */
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 2rem 1.25rem;
        }

        .erro {
            max-width: 34rem;
            padding: clamp(1.6rem, 5vw, 2.6rem);
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 3px solid var(--accent);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .erro__codigo {
            font-family: var(--mono);
            font-size: .78rem;
            letter-spacing: .14em;
            color: var(--accent-ink);
        }

        .erro h1 {
            margin: .5rem 0 .7rem;
            font-size: clamp(1.3rem, 4vw, 1.7rem);
            font-weight: 700;
        }

        .erro__pt {
            margin-bottom: 1rem;
            color: var(--ink-2);
        }

        .erro__outro {
            margin-bottom: .3rem;
            font-size: .86rem;
            color: var(--ink-3);
        }

        .erro__acoes {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
        }
    </style>
</head>

<body>
    <main class="erro">
        <p class="erro__codigo">404</p>
        <h1>Esta página não existe</h1>
        <p class="erro__pt">O endereço pode estar desatualizado. O currículo continua no mesmo lugar.</p>
        <p class="erro__outro" lang="en">This page doesn't exist — the résumé is still at the address below.</p>
        <p class="erro__outro" lang="zh-Hans">此页面不存在——简历仍在下方地址。</p>
        <div class="erro__acoes">
            <a class="botao botao--primario" href="/">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 11.5 12 4l8 7.5M6.5 10v9.5h11V10" />
                </svg>
                <span>Ver o currículo · View the résumé · 查看简历</span>
            </a>
        </div>
    </main>
</body>

</html>
